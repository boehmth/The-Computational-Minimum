# =============================================================================
#  MkDocs-Konfiguration für "Milestones in Agentic Systems"
# =============================================================================
#
#  Zwei-Schritte-Build (wegen MkDocs-Anforderung docs_dir != root):
#      python tools/sync_docs.py    # spiegelt Buch-Dateien nach docs/
#      python -m mkdocs build       # baut die Site nach _site/
#
#  Lokaler Betrieb im Watch-Modus:
#      python tools/sync_docs.py
#      python -m mkdocs serve
#      # dann http://127.0.0.1:8000 aufmachen
#
# =============================================================================

site_name: "Milestones in Agentic Systems"
site_description: >
  Sieben Meilensteine, die zeigen, wie aus einem Sprachmodell ein autonom
  handelndes System wird — vom "Hello, LLM"-Sechs-Zeiler bis zum Agent, der
  sich seine Werkzeuge selbst schreibt. Alles selbst programmiert, ohne
  Frameworks.
site_author: "Sebastian Ritter"
copyright: >
  Copyright &copy; 2024–2026 Sebastian Ritter.
  Text und Code stehen unter permissiver Lizenz — Details im Repo.

# ---------------------------------------------------------------------------
#  Ordner-Struktur
# ---------------------------------------------------------------------------
#  docs/ wird vom Skript tools/sync_docs.py aus dem Repo befüllt und ist
#  ein Build-Artefakt (in .gitignore ausgeschlossen).
# ---------------------------------------------------------------------------
docs_dir: docs
site_dir: _site

# Warnungen über Dateien, die nicht in der Nav auftauchen, unterdrücken.
# (Sie werden trotzdem gebaut und sind über direkte Links erreichbar.)
not_in_nav: |
  README.md
  README.en.md
  EXERCISES.en.md
  PREFACE.en.md
  ROADMAP.md
  STYLE.md
  _PLAN.md
  */README.en.md
  */EXERCISES.en.md

# ---------------------------------------------------------------------------
#  Navigation — die Kapitel-Reihenfolge im linken Menü
# ---------------------------------------------------------------------------
nav:
  - "Startseite":              index.md
  - "Vorwort":                 PREFACE.md

  - "Kapitel 1 · Text-in / Text-out":
      - "Überblick":                    01_TextInTextOut/README.md
      - "Übungen":                      01_TextInTextOut/EXERCISES.md

  - "Kapitel 2 · Tools & Planning":
      - "Überblick":                    02_ToolsAndPlanning/README.md
      - "Übungen":                      02_ToolsAndPlanning/EXERCISES.md
      - "Bonus · mini_agent":           02_ToolsAndPlanning/src/mini_agent/README.md

  - "Kapitel 3 · Der Loop":
      - "Überblick":                    03_TheLoop/README.md
      - "Übungen":                      03_TheLoop/EXERCISES.md

  - "Kapitel 4 · Reasoning innen drin":
      - "Überblick":                    04_ReasoningInside/README.md
      - "Übungen":                      04_ReasoningInside/EXERCISES.md

  - "Kapitel 5 · Protokolle & Skalierung":
      - "Überblick":                    05_ProtocolsAndScale/README.md
      - "Übungen":                      05_ProtocolsAndScale/EXERCISES.md
      - "Bonus · a2a live-server":      05_ProtocolsAndScale/src/a2a/README.md

  - "Kapitel 6 · Wann NICHT bauen":
      - "Überblick":                    06_WhenNotToBuild/README.md
      - "Übungen":                      06_WhenNotToBuild/EXERCISES.md

  - "Kapitel 7 · Dynamic Tool Agent":
      - "Überblick":                    07_DynamicToolAgent/README.md
      - "Übungen":                      07_DynamicToolAgent/EXERCISES.md

# ---------------------------------------------------------------------------
#  Theme — Material for MkDocs
# ---------------------------------------------------------------------------
theme:
  name: material
  language: de

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Zu dunklem Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Zu hellem Modus wechseln

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# ---------------------------------------------------------------------------
#  Zusatz-CSS
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

# ---------------------------------------------------------------------------
#  Markdown-Erweiterungen
# ---------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
      toc_depth: 4

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index:     !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ---------------------------------------------------------------------------
#  Plugins
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: de

# ---------------------------------------------------------------------------
#  Weitere Einstellungen
# ---------------------------------------------------------------------------
extra:
  generator: false