[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tcm-sitemap-plugin"
version = "0.1.0"
description = "Eigenes MkDocs-Sitemap-Plugin fuer The Computational Minimum"
requires-python = ">=3.8"

[project.entry-points."mkdocs.plugins"]
sitemap = "sitemap:SitemapPlugin"

[tool.setuptools]
py-modules = ["sitemap"]
