# =============================================================================
#  MkDocs-Konfiguration fuer "The Computational Minimum" (Online-Buch)
# =============================================================================
#
#  Alle vier Teile sind aktiv:
#  Teil 1 (01_Computing), Teil 2 (02_MachineIntelligence),
#  Teil 3 (03_LanguageModelling) und Teil 4 (04_AgenticSystems).
#
#  Zwei-Schritte-Build (wegen MkDocs-Anforderung docs_dir != root):
#      python tools/sync_docs.py    # spiegelt Buch-Dateien nach docs/
#      python -m mkdocs build       # baut die Site nach _site/
#
#  Lokaler Betrieb im Watch-Modus:
#      python tools/sync_docs.py
#      python -m mkdocs serve
#      # dann http://127.0.0.1:8000 aufmachen
#
#  Deployment: automatisch via .github/workflows/deploy-docs.yml
#
# =============================================================================

site_name: "The Computational Minimum — Lehrbuch über Rechnerarchitektur, Machine Intelligence & Agentic Systems"
site_description: >
  Ein freies Lehrbuch über Rechnerarchitektur, Machine Intelligence und
  Agentic Systems — vom 4-Bit-CPU-Simulator bis zum reasoning-fähigen
  Sprachmodell und dem Agenten, der seine eigenen Werkzeuge schreibt.
  Alles selbst geschrieben, ohne Frameworks, mit lauffähigen Python-Simulatoren.
site_author: "Dr. Thilo Böhm"
site_url: "https://boehmt.github.io/The-Computational-Minimum/"

copyright: >
  Copyright &copy; 2024–2026 Dr. Thilo Böhm.
  Text und Code stehen unter permissiver Lizenz — Details im Repo.

repo_name: "The-Computational-Minimum"
repo_url: "https://github.com/boehmt/The-Computational-Minimum"

edit_uri: "edit/main/"

# ---------------------------------------------------------------------------
#  Ordner-Struktur
# ---------------------------------------------------------------------------
#  docs/ wird vom Skript tools/sync_docs.py aus dem Repo befuellt und ist
#  ein Build-Artefakt (in .gitignore ausgeschlossen).
# ---------------------------------------------------------------------------
docs_dir: docs
site_dir: _site

# Warnungen ueber READMEs, die nicht in der Nav auftauchen, unterdruecken.
not_in_nav: |
  README.md

# ---------------------------------------------------------------------------
#  Navigation — die Kapitel-Reihenfolge im linken Menue
# ---------------------------------------------------------------------------
nav:
  - "Startseite":              index.md
  - "Vorwort":                 PREFACE.md

  - "Teil I · Computing":
      - "Übersicht":                    01_Computing/README.md
      - "00 · Fundament":               01_Computing/00_Fundament/README.md
      - "01 · CPU":                     01_Computing/01_CPU/README.md
      - "02 · Betriebssystem":          01_Computing/02_OS/README.md
      - "03 · Compiler":                01_Computing/03_Compiler/README.md
      - "04 · Perceptron auf CPU":      01_Computing/04_PerceptronOnCPU/README.md
      - "05 · GPU":                     01_Computing/05_GPU/README.md
      - "06 · Netzwerk":                01_Computing/06_Networks/README.md

  - "Teil II · Maschinelle Intelligenz":
      - "Übersicht":                    02_MachineIntelligence/README.md
      - "2.1 · Perceptron":             02_MachineIntelligence/01_Perceptron/README.md
      - "2.2 · Multi-Layer-Perzeptron": 02_MachineIntelligence/02_MLP/README.md
      - "2.3 · CNN":                    02_MachineIntelligence/03_CNN/README.md
      - "2.4 · Word2Vec":               02_MachineIntelligence/04_Word2Vec/README.md
      - "2.5 · RNN":                    02_MachineIntelligence/05_RNN/README.md
      - "2.6 · Seq2Seq":                02_MachineIntelligence/06_Seq2Seq/README.md
      - "2.7 · Transformer":            02_MachineIntelligence/07_Transformer/README.md


  - "Teil III · Entwicklung der Sprachmodelle":
      - "Übersicht":                    03_LanguageModelling/README.md
      - "3.1 · TinyGPT":                03_LanguageModelling/01_TinyGPT/README.md
      - "3.2 · TinyInstruct":           03_LanguageModelling/02_TinyInstruct/README.md
      - "3.3 · TinyChat":               03_LanguageModelling/03_TinyChat/README.md
      - "3.4 · TinyMoE":                03_LanguageModelling/04_TinyMoE/README.md
      - "3.5 · TinyReason":             03_LanguageModelling/05_TinyReason/README.md

  - "Teil IV · Agentic Systems":
      - "Übersicht":                    04_AgenticSystems/index.md
      - "4.1 · Text-in / Text-out":     04_AgenticSystems/01_TextInTextOut/README.md
      - "4.2 · Tools & Planning":       04_AgenticSystems/02_ToolsAndPlanning/README.md
      - "4.3 · Der Loop":               04_AgenticSystems/03_TheLoop/README.md
      - "4.4 · Reasoning innen drin":   04_AgenticSystems/04_ReasoningInside/README.md
      - "4.5 · Protokolle & Skalierung": 04_AgenticSystems/05_ProtocolsAndScale/README.md
      - "4.6 · Wann NICHT bauen":       04_AgenticSystems/06_WhenNotToBuild/README.md
      - "4.7 · Dynamic Tool Agent":     04_AgenticSystems/07_DynamicToolAgent/README.md

# ---------------------------------------------------------------------------
#  Theme — Material for MkDocs, mit unserer Serien-Palette
# ---------------------------------------------------------------------------
theme:

  name: material
  language: de

  # Overrides fuer SEO-Meta-Tags (Open Graph / Twitter Cards) in
  # overrides/main.html
  custom_dir: overrides



  # Fonts kommen aus Google Fonts; die konkreten Farben liegen in extra.css.
  font:
    text: Inter
    code: JetBrains Mono

  palette:
    # Heller Modus — Papier + TdF-Blau
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Zu dunklem Modus wechseln
    # Dunkler Modus — Anthrazit + Papier-Akzente
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Zu hellem Modus wechseln

  features:
    - navigation.instant          # Instant Loading (SPA-artige Uebergaenge)
    - navigation.tracking         # URL updaten beim Scrollen
    - navigation.tabs             # Top-Level als Tabs oben
    - navigation.tabs.sticky
    - navigation.sections         # Unter-Sections aufgeklappt
    - navigation.indexes          # Section-Root-Seiten
    - navigation.top              # "Zum Anfang"-Button
    - toc.follow                  # Toc scrollt mit
    - search.suggest              # Vorschlaege beim Tippen
    - search.highlight            # Trefferwoerter hervorheben
    - content.code.copy           # "Kopieren"-Button in Codebloecken

# ---------------------------------------------------------------------------
#  Zusatz-CSS (unsere Serien-Palette und Font-Feinschliff)
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

# ---------------------------------------------------------------------------
#  Markdown-Erweiterungen
# ---------------------------------------------------------------------------
markdown_extensions:
  # Standard-Erweiterungen fuer die typischen Sinnbilder
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
      toc_depth: 4

  # PyMdown-Erweiterungen (kommen mit mkdocs-material)
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index:     !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # LaTeX-Mathematik ($…$ und $$…$$) via MathJax
  - pymdownx.arithmatex:
      generic: true

# ---------------------------------------------------------------------------
#  Extras: MathJax fuer Formel-Rendering
# ---------------------------------------------------------------------------
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# ---------------------------------------------------------------------------
#  Plugins
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: de
  # SEO: erzeugt automatisch sitemap.xml (Google findet alle Seiten schneller)
  # Eigenes Plugin in tools/sitemap.py + tools/pyproject.toml (MkDocs 1.6 hat
  # das Kern-Plugin entfernt; das Community-Paket ist auf PyPI nicht verfuegbar).
  # Installation:  pip install -e tools/
  - sitemap


  # SEO: erzeugt Open-Graph- und Twitter-Card-Meta-Tags aus den Seiten-Titeln
  - meta
  # SEO: minifiziert HTML/CSS/JS fuer schnellere Ladezeiten (Ranking-Faktor)
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true

# ---------------------------------------------------------------------------
#  Weitere Einstellungen
# ---------------------------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/boehmt/The-Computational-Minimum
  generator: false     # "Made with MkDocs Material"-Footer ausblenden



